spring.application.name=skillmap-api

# Base de datos en memoria para desarrollo (commit inicial).
# Cuando se conecte el backend real, esto se reemplaza por PostgreSQL.
spring.datasource.url=jdbc:h2:mem:skillmapdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Analizador de ofertas con IA (Gemini). La API key NO va aquí: se lee de la
# variable de entorno GEMINI_API_KEY (ver GeminiApiKeyProvider).
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-3.8-flash
# Si el principal responde 503 o 429, se prueba este (una sola llamada por modelo y análisis).
gemini.fallback-model=gemini-3.5-flash
# Máximo por intento, y máximo de la petición completa sumando reintentos y esperas.
gemini.timeout=30s
gemini.total-timeout=35s

# Ofertas de empleo reales (Remotive y Arbeitnow). No usan IA ni API key.
jobs.remotive.base-url=https://remotive.com/api
# Categorías de Remotive que se guardan, con el nombre que devuelve GET /api/remote-jobs/categories
# (sin distinguir mayúsculas). El feed público ignora el filtro de la URL: se filtra al recibir.
# Vacío = se aceptan todas.
jobs.remotive.categories=Software Development,Artificial Intelligence,Data and Analytics,Devops,\
  Quality Assurance,Information Technology
jobs.arbeitnow.base-url=https://www.arbeitnow.com/api
jobs.arbeitnow.max-pages=3
# Arbeitnow es generalista: solo se guardan (y cuentan para la demanda) las ofertas técnicas.
# Todas las palabras se buscan al inicio de palabra y sin distinguir mayúsculas.
# - tech-keywords: en el título o en las etiquetas.
# - tech-title-keywords: solo en el título (en las etiquetas son demasiado amplias).
# - excluded-title-keywords: si el título contiene una, la oferta se descarta siempre.
# Sin tech-keywords ni tech-title-keywords no se filtra (salvo las exclusiones).
jobs.arbeitnow.tech-keywords=software,developer,frontend,front-end,backend,back-end,fullstack,full-stack,\
  devops,cloud,mobile,ios,android,programmer,machine learning,qa,sre,entwickler
jobs.arbeitnow.tech-title-keywords=engineer,data
jobs.arbeitnow.excluded-title-keywords=mechanical,electrical,civil,hausmeister,haustechniker,\
  data protection,datenschutz
jobs.http.timeout=20s
# Una vez al día (UTC). Remotive pide no pasar de ~4 llamadas diarias: por eso además
# ninguna fuente se vuelve a consultar antes de min-interval, aunque se pida a mano.
jobs.sync.cron=0 0 6 * * *
jobs.sync.min-interval=6h
jobs.retention.max-postings=1000
jobs.retention.max-age=60d
# Con menos ofertas que esto la muestra es pequeña y se deja la demanda anterior.
jobs.demand.min-postings=30
