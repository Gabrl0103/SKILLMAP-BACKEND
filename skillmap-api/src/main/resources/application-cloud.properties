# Perfil "cloud": servicio de IA para Render (ver CloudConfig). Se activa con --spring.profiles.active=cloud.
# La key de Gemini sale SOLO de la variable de entorno GEMINI_API_KEY; nunca va en este archivo.

# Render indica el puerto en PORT y exige escuchar en todas las interfaces.
server.port=${PORT:8080}
server.address=0.0.0.0
# La IP del cliente sale de X-Forwarded-For puesta por el proxy de Render (para el cupo por IP).
server.forward-headers-strategy=native

# Sin base de datos: ni H2, ni JPA, ni repositorios.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration
spring.h2.console.enabled=false
spring.jpa.show-sql=false
# Sin frontend: no se sirven archivos estáticos.
spring.web.resources.add-mappings=false

# Cupo diario (UTC, en memoria): por IP y entre todas, para no agotar la cuota de la key del servidor.
skillmap.ai.daily-limit-per-ip=20
skillmap.ai.daily-limit-global=150
